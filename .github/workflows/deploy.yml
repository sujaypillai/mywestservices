name: Deploy to Azure App Service

on:
    push:
        branches:
            - main
    workflow_dispatch: # Allow manual trigger

permissions:
    id-token: write
    contents: read

env:
    AZURE_WEBAPP_NAME: azure-my-services
    AZURE_RESOURCE_GROUP: rg-malaysia-west-services
    PYTHON_VERSION: "3.12"

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: "pip"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Run tests (optional)
              run: |
                  # Add your test commands here
                  # pytest tests/ --verbose
                  echo "No tests configured yet"

            - name: Login to Azure
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Configure App Settings
              if: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING != '' }}
              run: |
                  az webapp config appsettings set \
                    --name "${{ env.AZURE_WEBAPP_NAME }}" \
                    --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
                    --settings APPLICATIONINSIGHTS_CONNECTION_STRING="${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}" \
                    --output none

            - name: Deploy to Azure Web App
              uses: azure/webapps-deploy@v3
              with:
                  app-name: ${{ env.AZURE_WEBAPP_NAME }}

            - name: Azure logout
              run: az logout
              if: always()
